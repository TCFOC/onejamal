<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account Settings</title>
  <meta name="description" content="One Jamal Account Settings" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="https://tcfthailand.com/tstaff/favicon.ico" />
  <link rel="apple-touch-icon" sizes="128x128" href="favicon.ico" />

  <style>
    :root {
      --brand-1: #57a4ff;
      --brand-2: #5781ff;
      --brand-3: #fa5ca8;
      --brand-4: #ff9100;
      --brand-start: #ad28f5;
      --brand-end: #2d68f2;

      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #111111;
      --muted: #666666;
      --border: #e6e8ef;
      --shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
      --shadow-strong: 0 16px 34px rgba(0, 0, 0, 0.10);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans Thai", system-ui, sans-serif;
      line-height: 1.6;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      color: #ffffff;
      background: linear-gradient(135deg, var(--brand-1), var(--brand-2), var(--brand-3), var(--brand-4));
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      font-size: 1.2rem;
      font-weight: 600;
    }

    .brand-title {
      white-space: nowrap;
    }

    .topbar-link {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 400;
      opacity: 0.95;
    }

    .topbar-link:hover {
      text-decoration: underline;
      opacity: 1;
    }

    .settings-shell {
      width: min(960px, calc(100% - 24px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(260px, 0.8fr);
      gap: 12px;
      align-items: start;
    }

    .card {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 1.25rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      box-shadow: var(--shadow);
      animation: fade-up 0.28s ease both;
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-title {
      margin: 0 0 0.35rem;
      color: var(--brand-start);
      font-size: 1.35rem;
      line-height: 1.3;
    }

    .muted {
      margin: 0 0 1.2rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .settings-form {
      display: grid;
      gap: 0.75rem;
    }

    .field-label {
      color: #333333;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: left;
    }

    .form-input {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid #cccccc;
      border-radius: 10px;
      outline: none;
      background: #ffffff;
      color: var(--text);
    }

    .form-input:focus {
      border-color: var(--brand-end);
      box-shadow: 0 0 0 4px rgba(45, 104, 242, 0.12);
    }

    .form-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 44px;
      padding: 0.8rem 1rem;
      border: 0;
      border-radius: 10px;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease;
    }

    .form-button:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-strong);
    }

    .form-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .form-button.blue {
      background: var(--brand-end);
    }

    .form-button.orange {
      background: var(--brand-4);
    }

    .form-status {
      min-height: 1.4em;
      margin: 0;
      color: #d23;
      font-size: 0.9rem;
      text-align: left;
    }

    .form-status.success {
      color: #15803d;
    }

    .info-section {
      border-top: 1px solid #eeeeee;
      margin-top: 1.2rem;
      padding-top: 1.2rem;
    }

    .info-section:first-child {
      border-top: 0;
      margin-top: 0;
      padding-top: 0;
    }

    .info-section h2 {
      margin: 0 0 0.25rem;
      font-size: 1.05rem;
      line-height: 1.3;
    }

    .info-section p {
      margin: 0 0 0.9rem;
      color: #333333;
      font-size: 0.95rem;
    }

    .account-note {
      border-left: 4px solid var(--brand-4);
      border-radius: 10px;
      background: #fff7ed;
      padding: 0.85rem 1rem;
      color: #7c2d12;
      font-size: 0.92rem;
    }

    .version {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
    }

    @media (max-width: 760px) {
      html {
        font-size: 15px;
      }

      .topbar {
        padding: 0.9rem 1rem;
      }

      .settings-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand-title">One Jamal</div>
    <a class="topbar-link" href="https://tcfthailand.com/tstaff" target="_self">← Back to Home</a>
  </header>

  <main class="settings-shell">
    <div class="settings-grid">
      <section class="card" aria-labelledby="welcome">
        <h1 id="welcome" class="card-title">Loading, please wait...</h1>
        <p class="muted">Account Settings</p>

        <form id="nameForm" class="settings-form" autocomplete="on">
          <label class="field-label" for="nameInput">Full Name</label>
          <input id="nameInput" class="form-input" type="text" placeholder="Enter your full name" autocomplete="name" required />
          <button id="saveNameBtn" class="form-button blue" type="submit">Save Name</button>
          <p id="nameStatus" class="form-status"></p>
        </form>

        <!--
          TEMPORARILY DISABLED: Role selection fields

          <div class="role-dropdown">
            <div id="selectedRole" class="role-selected">
              <span id="selectedRoleLabel">Select role…</span>
              <span class="chevron">▾</span>
            </div>
            <div id="roleList" class="role-list"></div>
          </div>

          <button id="submitBtn" class="submit-btn" onclick="submitRole()" disabled>Save Role</button>
        -->
      </section>

      <aside class="card">
        <section class="info-section">
          <h2>Contact Information</h2>
          <p>Optional, but recommended</p>
          <a class="form-button blue" href="https://tcfthailand.com/onejamal/settings/phone" target="_self">Add/Edit Phone Number</a>
          <!-- <a class="form-button blue" href="https://tcfthailand.com/tstaff/parent" target="_self">Add/Edit Parent Number</a> -->
        </section>
      </aside>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDKHyMNxgnUH9zn0HQHDNf98GFphC9rv_4",
      authDomain: "tstaff-tcf.firebaseapp.com",
      projectId: "tstaff-tcf",
      storageBucket: "tstaff-tcf.firebasestorage.app",
      messagingSenderId: "1038965947691",
      appId: "1:1038965947691:web:8a2f21a6424b82c14ad96e",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);

    const dom = {
      welcome: $("welcome"),
      nameForm: $("nameForm"),
      nameInput: $("nameInput"),
      saveNameBtn: $("saveNameBtn"),
      nameStatus: $("nameStatus"),
    };

    let currentUserEmail = null;

    function firstNameOf(value) {
      return String(value || "there").trim().split(/\s+/)[0] || "there";
    }

    function setStatus(message, type = "error") {
      dom.nameStatus.textContent = message;
      dom.nameStatus.classList.toggle("success", type === "success");
    }

    function setSaving(isSaving) {
      dom.saveNameBtn.disabled = isSaving;
      dom.saveNameBtn.textContent = isSaving ? "Saving..." : "Save Name";
    }

    async function saveName(event) {
      event.preventDefault();
      if (!currentUserEmail) return;

      const newName = dom.nameInput.value.trim();

      if (!newName) {
        setStatus("Please enter a name.");
        return;
      }

      setSaving(true);
      setStatus("");

      try {
        const userRef = doc(db, "users", currentUserEmail);
        await setDoc(userRef, { name: newName }, { merge: true });

        dom.welcome.textContent = `Hey, ${firstNameOf(newName)}!`;
        setStatus("Name saved successfully.", "success");
      } catch (err) {
        console.error(err);
        setStatus(`Error: ${err.message}`);
      } finally {
        setSaving(false);
      }
    }

    /*
      TEMPORARILY DISABLED: Role selection logic

      The old role dropdown, role count loading, role selection, and submitRole()
      logic were intentionally removed from the active page for now.
      Restore them together with the commented role selection fields above when needed.
    */

    dom.nameForm.addEventListener("submit", saveName);

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "/tstaff";
        return;
      }

      currentUserEmail = user.email;

      const userRef = doc(db, "users", user.email);
      const snap = await getDoc(userRef);

      if (snap.exists()) {
        const data = snap.data();
        const savedName = data.name || user.email || "";
        dom.nameInput.value = savedName;
        dom.welcome.textContent = `Hey, ${firstNameOf(savedName)}!`;
      } else {
        dom.nameInput.value = user.email || "";
        dom.welcome.textContent = `Hey, ${firstNameOf(user.email)}!`;
      }
    });
  </script>
</body>
</html>

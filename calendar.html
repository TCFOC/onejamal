<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --brand-start: #AD28F5;
      --brand-end: #2D68F2;
      --bg: #f6f7fb;
      --text: #111;
      --card: #fff;
      --border: #e6e8ef;
      --r: #ef4444;
      --o: #fb923c;
      --y: #eab308;
      --g: #22c55e;
      --b: #3b82f6;
      --p: #a855f7;
    }

    * {
      box-sizing: border-box;
      font-family: 'IBM Plex Sans Thai', system-ui, sans-serif;
    }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg);
      color: var(--text);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      color: #ffffff;
      background: linear-gradient(135deg, #57A4FF, #5781FF, #FA5CA8, #FF9100);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      font-size: 1.2rem;
      font-weight: 600;
    }

    .brand-title {
      white-space: nowrap;
    }

    .topbar-link {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 400;
      opacity: 0.95;
    }

    .topbar-link:hover {
      text-decoration: underline;
      opacity: 1;
    }


    .nav {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .navbtn {
      background: #fff;
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .calendar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 330px;
      padding: 20px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .08);
    }

    #monthTitle {
      text-align: center;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      gap: 4px;
    }

    .weekdays div {
      font-weight: 600;
      font-size: 0.85rem;
    }

    .day {
      padding: 14px 0;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      font-size: 1rem;
    }

    .day:hover {
      background: #eee;
    }

    .dots {
      display: flex;
      gap: 2px;
      justify-content: center;
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .35);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .popup {
      background: white;
      border-radius: 12px;
      padding: 20px 24px;
      width: 280px;
      position: relative;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .2);
      text-align: center;
    }

    .close {
      position: absolute;
      right: 10px;
      top: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .eventItem {
      margin-top: 8px;
      font-size: 0.9rem;
      padding: 6px;
      border-radius: 6px;
      background: #f2f2f2;
    }

    .colorball {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
      vertical-align: middle;
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand-title">Calendar</div>
    <a class="topbar-link" href="https://tcfthailand.com/tstaff" target="_self">← Back to Home</a>
  </header>
  <br>
  <div class="nav">
    <button class="navbtn" onclick="prevMonth()">&larr;</button>
    <span id="monthTitle"></span>
    <button class="navbtn" onclick="nextMonth()">&rarr;</button>
  </div>

  <div class="calendar">
    <div class="weekdays">
      <div>Sun</div>
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
    </div>
    <div class="days" id="days"></div>
  </div>

  <div id="overlay">
    <div class="popup">
      <div class="close" onclick="closePopup()">✕</div>
      <div id="popupSub"></div>
      <div id="popupEvents"></div>
    </div>
  </div>

  <script>
  

    let events = [];

fetch("events.json")
.then(res => res.json())
.then(data => {
events = data;
render();
})
.catch(err => {
console.error("Failed to load events:", err);
});

    // ==============================
    //  STATE
    // ==============================
    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();

    // ==============================
    //  RENDER
    // ==============================
    function render() {
      const first = new Date(currentYear, currentMonth, 1);
      const monthName = first.toLocaleString("en-US", { month: "long", year: "numeric" });
      document.getElementById("monthTitle").textContent = monthName;

      const startDay = first.getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const cont = document.getElementById("days");
      cont.innerHTML = "";

      for (let i = 0; i < startDay; i++) {
        cont.appendChild(document.createElement("div"));
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const div = document.createElement("div");
        div.className = "day";
        div.textContent = d;

        const key = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const todaysEvents = events.filter(e => e.date === key);

        if (todaysEvents.length) {
          const dotContainer = document.createElement("div");
          dotContainer.className = "dots";

          todaysEvents.forEach(ev => {
            const dot = document.createElement("div");
            dot.className = "dot";
            dot.style.background = colorCode(ev.color);
            dotContainer.appendChild(dot);
          });

          div.appendChild(dotContainer);
          div.onclick = () => openPopup(key, todaysEvents);
        }
        cont.appendChild(div);
      }
    }

    function colorCode(c) {
      return {
        red: "var(--r)", orange: "var(--o)", yellow: "var(--y)", green: "var(--g)",
        blue: "var(--b)", purple: "var(--p)"
      }[c] || "var(--b)";
    }

    // ==============================
    //  POPUP
    // ==============================
    function openPopup(date, list) {
      const dateObj = new Date(date);
      document.getElementById("popupSub").textContent =
        dateObj.toLocaleString("en-US", { weekday: "long", month: "long", day: "numeric" });

      let html = "";
      list.forEach(e => {
        html += `
    <div class="eventItem">
      <span class="colorball" style="background:${colorCode(e.color)}"></span>
      ${e.title}
    </div>`;
      });

      document.getElementById("popupEvents").innerHTML = html;
      document.getElementById("overlay").style.display = "flex";
    }

    function closePopup() {
      document.getElementById("overlay").style.display = "none";
    }

    // ==============================
    //  NAVIGATION
    // ==============================
    function prevMonth() {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      render();
    }

    function nextMonth() {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      render();
    }


  </script>

</body>

</html>
